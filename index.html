<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Resume Evaluator</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Resume Evaluator</h1>
        <nav>
    <a href="#">Login</a>
    <a href="#">Register</a>
  </nav>
    </header>
        

    <!-- Main Content -->
    <main>

        <!-- Form Area -->
        <section>
            <form>
            <label for="job-description">Job Description:</label>
            <textarea id="job-description" placeholder="Paste the job description here"></textarea>
            <label for="custom-prompt">Custom Prompt:</label>
            <textarea id="custom-prompt" placeholder="Enter any specific instructions or preferences"></textarea>
            <label for="resume">Upload Resume (PDF only):</label>
            <input type="file" id="resume" accept=".pdf" />
            <button type="submit">Evaluate Resume</button>
            </form>

            <div>
            <h2>Results</h2>
            <p>Results will appear here</p>
            </div>
        </section>

    </main>

</body>
</html>
